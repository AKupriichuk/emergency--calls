log_format debug_upstream '$time_iso8601 $status $request_time $upstream_addr $upstream_status $upstream_response_time "$request"';

server {
    listen 80;
    access_log /var/log/nginx/access.log debug_upstream;

    resolver 127.0.0.11 valid=2s;

    location / {
        set $upstream web:8000;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        error_page 502 504 = @retry;
    }

    # A container mid-teardown can leave new SYNs to it unanswered for a few
    # seconds (default proxy_connect_timeout is 60s), well past nginx's own
    # 2s DNS cache above. The short connect_timeout turns that hang into a
    # fast 502/504, and this internal redirect re-evaluates $upstream (a
    # fresh DNS lookup) so the retry goes to a live instance instead of the
    # same dead one.
    #
    # Only GET/HEAD are safe to retry this way: a POST/PUT/DELETE may have
    # already reached and mutated the dying instance before the connect
    # failed/timed out, so blindly replaying it against another instance
    # could create a duplicate record. Anything else just surfaces the
    # original error instead of retrying.
    location @retry {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 502;
        }
        set $upstream web:8000;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /noop {
        return 204;
    }
}
